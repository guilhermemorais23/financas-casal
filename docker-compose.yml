services:
  db:
    image: postgres:16-alpine
    container_name: fincae_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fincae}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fincae_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-fincae}
    ports:
      - "5432:5432"
    volumes:
      - fincae_pgdata:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./db/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro

volumes:
  fincae_pgdata:
